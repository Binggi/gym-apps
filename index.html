<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161C23" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Catatan latihan gym harian: set & beban, makan & protein, berat badan.">
  <title>Catatan Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="appbar">
    <button class="iconbtn" type="button" id="back" aria-label="Kembali" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <p class="appbar-title" id="appbar-title">Catatan Gym</p>
    <a class="iconbtn" href="#/cadangan" data-tab="cadangan" aria-label="Cadangan & aplikasi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
    </a>
  </header>

  <main class="wrap" id="app">
    <p class="muted">Memuat…</p>
  </main>

  <nav class="tabbar" aria-label="Menu utama">
    <a href="#/" data-tab="beranda"><span class="ind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></span>Beranda</a>
    <a href="#/latihan" data-tab="latihan"><span class="ind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Latihan</a>
    <a href="#/harian" data-tab="harian"><span class="ind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Harian</a>
    <a href="#/badan" data-tab="badan"><span class="ind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9.5a4 4 0 0 1 6 0M12 9.5l1.2-1.6"/></svg></span>Badan</a>
  </nav>

  <p class="toast" id="toast" role="status" hidden></p>

  <div class="rest" id="rest" hidden role="timer" aria-live="off">
    <span><span class="t">1:30</span> <span class="lbl">Istirahat</span></span>
    <button type="button" data-add>+30 dtk</button>
    <button type="button" data-stop>Tutup</button>
  </div>

  <noscript><p class="wrap">Aplikasi ini butuh JavaScript. Buka di Chrome.</p></noscript>
</body>
</html>
